name: Propose a new entry
description: Tell us about a digital edition project of Renaissance-era texts that is not yet in the catalogue.
title: "[new entry] "
labels: ["new-entry", "status:needs-review"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping to build this catalogue.

        Fill in what you know. Leave blank what you do not. A maintainer will review your submission and add it to the catalogue.

        **One distinction matters.** We catalogue projects that provide **digital editions**: transcriptions, editorial text, or corrected OCR/HTR of Renaissance-era documents (roughly 1450 to 1700). We do **not** catalogue page images or facsimiles only, raw uncorrected OCR dumps, or bibliographies with no texts.

        **The inclusion rule.** Collections that provide freely accessible Renaissance texts are eligible even when their contents overlap with other resources. Texts requiring payment or a subscription are excluded; free previews and trials do not qualify. Each collection’s word and text totals are recorded within 1450–1700, before content deduplication, with their source and coverage. Leave unknown counts blank. Deduplication applies separately to the Renascor Corpus Project; directories and search portals without texts are out of scope.

        If you are unsure whether a project qualifies, submit it anyway and say so.

  - type: input
    id: title
    attributes:
      label: Project name
      description: The name of the edition project or collection.
      placeholder: "e.g. TextGrid Repository"
    validations:
      required: true

  - type: input
    id: url
    attributes:
      label: URL
      description: The main page where the edition can be found.
      placeholder: "https://..."
    validations:
      required: true

  - type: input
    id: doi
    attributes:
      label: Collection DOI
      description: DOI of the collection, edition or archived text dataset release, if available. Do not give the DOI of a grant, article or poster about it.
      placeholder: "10.5281/zenodo.14559525"

  - type: input
    id: data_url
    attributes:
      label: Files URL
      description: Where the machine-readable files (TEI XML, other XML, plain text...) can be downloaded, if they are available, for example a GitHub repository, a download page or a Zenodo record. Leave blank if there is none or you do not know.
      placeholder: "https://github.com/... or https://zenodo.org/records/..."

  - type: input
    id: languages
    attributes:
      label: Language(s)
      description: Plain names are fine. If the project is multilingual, list them separated by commas.
      placeholder: "e.g. Latin, or French and German"
    validations:
      required: true

  - type: dropdown
    id: encoding
    attributes:
      label: Encoding format
      description: How is the text encoded? If the project offers several formats, choose the richest one (TEI XML first).
      options:
        - TEI XML
        - Other XML
        - JSON
        - HTML
        - Plain text
        - Wiki markup
        - Markdown
        - Other
        - I am not sure
    validations:
      required: true

  - type: input
    id: license
    attributes:
      label: Text licence
      description: Licence of the edition texts, such as CC-BY-SA-4.0, CC0-1.0, Copyright or Mixed. Leave blank if not stated.

  - type: input
    id: license_url
    attributes:
      label: Licence source URL
      description: The publisher terms, dataset record or licence file supporting this licence.

  - type: input
    id: api_url
    attributes:
      label: API documentation URL
      description: Official documentation for accessing the texts through an API, if available.

  - type: dropdown
    id: status
    attributes:
      label: Is the project active?
      options:
        - Active (currently maintained, updated, or accepting contributions)
        - Archived (no longer maintained, but still online)
        - Discontinued (no longer online)
        - I am not sure
    validations:
      required: true

  - type: input
    id: institution
    attributes:
      label: Institution or team
      description: Who is behind the edition? A university, a library, a research team, an individual?
      placeholder: "e.g. University of St Andrews, or a research project name"

  - type: input
    id: period
    attributes:
      label: Period covered
      description: What period do the texts cover? The project's scope is roughly 1450 to 1700, but partial overlap is fine.
      placeholder: "e.g. 16th century, or 1550-1620"

  - type: input
    id: region
    attributes:
      label: Geographic area
      description: What region or country do the texts come from?
      placeholder: "e.g. Italy, Low Countries, England"

  - type: input
    id: words
    attributes:
      label: Approximate size (words)
      description: Any unit you have. If you do not know, leave blank.
      placeholder: "e.g. 500000, or 'several million'"

  - type: input
    id: years_active
    attributes:
      label: Years active
      description: When did the project start and end? Use 'ongoing' if still active.
      placeholder: "e.g. 2010-2020, or 2015-ongoing"

  - type: textarea
    id: notes
    attributes:
      label: Anything else we should know
      description: Author of the source texts, licence, access conditions, quality notes, why it matters, or anything else.

  - type: checkboxes
    id: scope
    attributes:
      label: Scope
      description: "Renaissance is a historical and cultural focus centred on Europe, particularly Western Europe, within 1450–1700. Texts arising from documented contacts with other populations also qualify, regardless of language or authorship. For collections outside Europe, explain the historical connection and the relevant subset above."
      options:
        - label: "As far as I can tell, this project falls within that scope, or I have explained above why it is a borderline case."
          required: true
