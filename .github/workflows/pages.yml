name: Deploy site to GitHub Pages

# Builds the static site from data/entries/ and deploys it to GitHub Pages.
# The site is a single HTML page with vanilla JS. scripts/build_site.py writes
# the data payload (data.json), the downloads (renascor.csv, renascor.json) and
# the figures of the page (index.html).

on:
  push:
    branches: [main]
    paths:
      - 'data/entries/**'
      - 'docs/**'
      - 'scripts/build_site.py'
      - 'schema/**'
      - 'CITATION.cff'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Full history: "data of" is the date of the last commit that changed
      # data/entries, which a shallow clone cannot tell.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install jsonschema

      - name: Build site
        run: python scripts/build_site.py

      - name: Upload artefact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
