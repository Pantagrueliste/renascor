name: Weekly discovery

# Runs a Mistral agent weekly (and on manual trigger) to discover new digital
# edition projects. The agent searches the web and returns candidates in the
# catalogue schema. Candidates are never merged automatically: the workflow
# commits the candidate entries on a branch 'discovered/<date>' and opens a
# pull request labelled 'discovered' for human review.
#
# Cost control: hard cap of 1 API call per run, using Mistral Large 4
# (mistral-large-4-0, preview rate $0.68/M input, $2.09/M output).
# Estimated cost per run: a few cents.

on:
  schedule:
    # Every Monday at 06:00 UTC.
    - cron: '0 6 * * 1'
  workflow_dispatch:

concurrency:
  group: discover
  cancel-in-progress: false

# The discovery job pushes a branch and opens a pull request for review.
permissions:
  contents: write
  pull-requests: write

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install jsonschema

      - name: Install gh CLI
        run: |
          # gh CLI is pre-installed on GitHub-hosted runners, but ensure it is available.
          gh --version

      - name: Run discovery
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/discover.py

      - name: Log cost summary
        if: always()
        run: |
          echo "## Weekly discovery run" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Model: mistral-large-4-0 (Mistral Large 4, v26.10 preview)" >> $GITHUB_STEP_SUMMARY
          echo "- Max API calls: 1" >> $GITHUB_STEP_SUMMARY
          echo "- Estimated cost per run: a few cents" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "See the workflow log for exact token usage and cost." >> $GITHUB_STEP_SUMMARY
