[project]
name = "renascor"
version = "0.1.0"
description = "An open catalogue of digital editions of Renaissance-era written documents"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Clément Godbarge", email = "clement.godbarge@st-andrews.ac.uk" },
]
keywords = ["digital humanities", "renaissance", "catalogue", "digital editions"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "jsonschema>=4.20",
    "requests>=2.31",
    "mistralai>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "ruff>=0.1",
]

[project.urls]
Homepage = "https://github.com/Pantagrueliste/renascor"
Repository = "https://github.com/Pantagrueliste/renascor"
Issues = "https://github.com/Pantagrueliste/renascor/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scripts"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
