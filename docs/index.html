<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Renascor: digital editions of Renaissance texts</title>
<meta name="description" content="An open catalogue of digital editions of Renaissance-era written documents.">
<style>
  :root {
    color-scheme: light dark;
    --bg: #ffffff;
    --card: #ffffff;
    --fg: #111318;
    --muted: #646b76;
    --border: #e4e6ea;
    --accent: #1a56db;
    --accent-soft: #eef3fd;
    --accent-fg: #ffffff;
    --active-bg: #e5f4e9;
    --active-fg: #1e6b34;
    --archived-bg: #ececec;
    --archived-fg: #5c636d;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #101216;
      --card: #16191e;
      --fg: #e8eaee;
      --muted: #9198a3;
      --border: #272b32;
      --accent: #6d9bff;
      --accent-soft: #1c2436;
      --accent-fg: #101216;
      --active-bg: #1d2b22;
      --active-fg: #8fcda1;
      --archived-bg: #26292f;
      --archived-fg: #9198a3;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font: 15px/1.6 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 1200px; margin: 0 auto; padding: 0 1.5rem 4rem; }

  /* ── Header ───────────────────────────────────────────── */
  header {
    max-width: 1200px; margin: 0 auto;
    padding: 2.2rem 1.5rem 1.6rem;
    display: flex; align-items: baseline; gap: 1.4rem; flex-wrap: wrap;
  }
  header h1 { font-size: 1.35rem; font-weight: 700; letter-spacing: -.01em; margin: 0; }
  header h1 a { color: var(--fg); text-decoration: none; }
  header p { color: var(--muted); margin: 0; font-size: .95rem; }
  .hero-stats {
    margin-left: auto; display: flex; gap: 1.6rem;
    font-size: .85rem; color: var(--muted); font-variant-numeric: tabular-nums;
  }
  .hero-stats b { color: var(--fg); font-weight: 600; }

  /* ── Toolbar ──────────────────────────────────────────── */
  .toolbar {
    position: sticky; top: 0; z-index: 5;
    background: var(--bg);
    border-top: 1px solid var(--border);
    border-bottom: 1px solid var(--border);
  }
  .toolbar-inner {
    max-width: 1200px; margin: 0 auto;
    padding: .75rem 1.5rem;
    display: flex; flex-wrap: wrap; gap: .6rem .8rem; align-items: flex-end;
  }
  .toolbar label {
    font-size: .7rem; letter-spacing: .08em; text-transform: uppercase;
    color: var(--muted); display: block; margin-bottom: .25rem;
  }
  .toolbar input, .toolbar select {
    font: inherit; font-size: .9rem;
    padding: .4rem .55rem; border: 1px solid var(--border);
    border-radius: 6px; background: var(--card); color: var(--fg); min-width: 128px;
  }
  .toolbar input { min-width: 210px; }
  .toolbar input:focus-visible, .toolbar select:focus-visible,
  .toolbar button:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 1px;
  }
  .toolbar input::placeholder { color: var(--muted); }
  .toolbar button {
    font: inherit; font-size: .9rem;
    padding: .4rem .85rem; border: 1px solid var(--border); border-radius: 6px;
    background: var(--card); color: var(--fg); cursor: pointer;
  }
  .toolbar button:hover { border-color: var(--muted); }
  .view-toggle { display: inline-flex; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
  .view-toggle button { border: none; border-radius: 0; padding: .4rem .85rem; }
  .view-toggle button + button { border-left: 1px solid var(--border); }
  .view-toggle button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  .controls-spacer { flex: 1; }
  .stats { color: var(--muted); font-size: .88rem; margin: .9rem 0 1rem; }

  /* ── Cards view ───────────────────────────────────────── */
  #cards {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(310px, 1fr));
    gap: .9rem;
  }
  .card {
    display: flex; flex-direction: column; gap: .5rem;
    padding: 1.05rem 1.15rem .95rem; background: var(--card);
    border: 1px solid var(--border); border-radius: 10px;
    transition: border-color .12s ease;
  }
  .card:hover { border-color: var(--muted); }
  .card h2 { font-size: 1.02rem; font-weight: 650; line-height: 1.35; margin: 0; letter-spacing: -.01em; }
  .card h2 a { color: var(--fg); text-decoration: none; }
  .card h2 a:hover { color: var(--accent); }
  .card-head { display: flex; align-items: flex-start; justify-content: space-between; gap: .6rem; }
  .card-inst { font-size: .82rem; color: var(--muted); }
  .meta { display: flex; flex-wrap: wrap; gap: .3rem; }
  .tag {
    display: inline-block; padding: .06rem .5rem; border-radius: 5px;
    background: var(--accent-soft); font-size: .76rem; color: var(--fg);
    font-variant-numeric: tabular-nums;
  }
  .tag.label { background: none; border: 1px solid var(--border); color: var(--muted); font-size: .74rem; }
  .card-notes {
    font-size: .85rem; color: var(--muted); line-height: 1.5; margin: 0;
    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
  }
  .card-notes.expanded { display: block; overflow: visible; }
  .card-foot {
    display: flex; align-items: center; justify-content: space-between;
    gap: .5rem; margin-top: auto; font-size: .8rem; color: var(--muted);
  }
  .card-foot .visit { color: var(--accent); font-size: .84rem; text-decoration: none; font-weight: 550; }
  .card-foot .visit:hover { text-decoration: underline; }
  .more {
    background: none; border: none; padding: 0; font: inherit; font-size: .78rem;
    color: var(--accent); cursor: pointer;
  }
  .more:hover { text-decoration: underline; }
  .meta-line { display: flex; flex-wrap: wrap; gap: .25rem 1rem; font-size: .85rem; }
  .meta-line span b { color: var(--muted); font-weight: 500; }
  body.view-table #cards { display: none; }
  body.view-card #table { display: none; }

  /* ── Table view ───────────────────────────────────────── */
  table { width: 100%; border-collapse: collapse; font-size: .88rem; }
  th, td { text-align: left; padding: .55rem .75rem; border-bottom: 1px solid var(--border); vertical-align: top; }
  th {
    font-weight: 600; color: var(--muted); position: sticky; top: 0; background: var(--bg);
    font-size: .72rem; letter-spacing: .07em; text-transform: uppercase;
    border-bottom: 1px solid var(--muted);
  }
  tbody tr:hover { background: var(--accent-soft); }
  td a { color: var(--accent); text-decoration: none; }
  td a:hover { text-decoration: underline; }
  .num { font-variant-numeric: tabular-nums; white-space: nowrap; }

  /* ── Badges ───────────────────────────────────────────── */
  .badge {
    display: inline-block; padding: .1rem .5rem; border-radius: 999px;
    font-size: .72rem; font-weight: 550;
    background: var(--archived-bg); color: var(--archived-fg); white-space: nowrap;
  }
  .badge.active { background: var(--active-bg); color: var(--active-fg); }

  footer {
    max-width: 1200px; margin: 2.5rem auto 0; padding: 1.2rem 1.5rem 0;
    border-top: 1px solid var(--border);
    color: var(--muted); font-size: .85rem;
  }
  footer a { color: var(--accent); }
  footer p { margin: 0; }

  @media (max-width: 640px) {
    header { padding: 1.6rem 1rem 1.2rem; gap: .4rem; }
    .hero-stats { margin-left: 0; width: 100%; gap: 1.1rem; }
    .toolbar-inner { padding: .7rem 1rem; }
    .toolbar input, .toolbar select { min-width: 100%; }
  }
</style>
</head>
<body class="view-card">
<header>
  <h1><a href="#">Renascor</a></h1>
  <p>An open catalogue of digital editions of Renaissance-era written documents.</p>
  <div class="hero-stats" id="hero-stats"></div>
</header>

<div class="wrap">
  <div class="toolbar">
    <div class="toolbar-inner">
      <div>
        <label for="search">Search</label>
        <input type="search" id="search" placeholder="title, institution, author..." autocomplete="off">
      </div>
      <div>
        <label for="f-language">Language</label>
        <select id="f-language"><option value="">All</option></select>
      </div>
      <div>
        <label for="f-encoding">Encoding</label>
        <select id="f-encoding"><option value="">All</option></select>
      </div>
      <div>
        <label for="f-status">Status</label>
        <select id="f-status"><option value="">All</option></select>
      </div>
      <div>
        <label for="f-period">Period</label>
        <select id="f-period"><option value="">All</option></select>
      </div>
      <div>
        <label for="f-region">Region</label>
        <select id="f-region"><option value="">All</option></select>
      </div>
      <div class="controls-spacer"></div>
      <div>
        <label>View</label>
        <div class="view-toggle" role="group" aria-label="View mode">
          <button id="view-cards" aria-pressed="true" type="button">Cards</button>
          <button id="view-table" aria-pressed="false" type="button">Table</button>
        </div>
      </div>
      <div>
        <label>Export</label>
        <button id="dl-csv">CSV</button>
        <button id="dl-json">JSON</button>
      </div>
    </div>
  </div>

  <p class="stats" id="stats">Loading...</p>

  <div id="cards"></div>

  <table id="table">
    <thead>
      <tr>
        <th>Project</th>
        <th>Language</th>
        <th>Period</th>
        <th>Region</th>
        <th>Encoding</th>
        <th>Words</th>
        <th>Active</th>
        <th>Institution</th>
        <th>Status</th>
      </tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>

  <footer>
    <p>
      Data: <a href="https://github.com/Pantagrueliste/renascor/tree/main/data/entries">github.com/Pantagrueliste/renascor</a>
      (CC0 1.0) ·
      <a href="https://github.com/Pantagrueliste/renascor/issues/new?template=new-entry.yml">report a missing edition</a>
    </p>
  </footer>
</div>

<script src="app.js"></script>
</body>
</html>
